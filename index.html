<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06141f">
  <script>
    (function () {
      var theme = 'dark';
      try {
        var stored = localStorage.getItem('ckg.theme');
        if (stored === 'light' || stored === 'dark') theme = stored;
        else theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f3ea' : '#06141f');
      var lang = 'en';
      var path = location.pathname;
      if (/\/es(\/|$)/.test(path)) lang = 'es';
      else if (!/\/(region|river|with)(\/|$)/.test(path)) {
        try {
          var chosen = localStorage.getItem('ckg.lang');
          if (chosen === 'es' || (!chosen && /^es/i.test(navigator.language || ''))) lang = 'es';
        } catch (e) {}
      }
      document.documentElement.lang = lang;
    })();
  </script>
  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      if (parts.length && parts[parts.length - 1].indexOf('.') !== -1) parts.pop();
      var markers = { region: 1, river: 1, es: 1, with: 1 };
      var baseParts = [];
      for (var i = 0; i < parts.length; i++) {
        if (markers[parts[i]]) break;
        baseParts.push(parts[i]);
      }
      var base = baseParts.length ? '/' + baseParts.join('/') + '/' : '/';
      window.__APP_BASE__ = base;
      var el = document.createElement('base');
      el.setAttribute('href', base);
      document.head.appendChild(el);
    })();
  </script>
  <title>Chile Whitewater Kayak Guide</title>
  <meta name="description" content="Chile Whitewater Kayak Guide: 44 runs on a map of Chile, with live levels from Chile Water Levels where a gauge matches the run.">
  <meta name="color-scheme" content="dark light">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Chile Whitewater Kayak Guide">
  <meta property="og:description" content="A sibling of Chile Water Levels. Pick a region, see the grade, and read the live gauge when it is the right one.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kayak Guide">
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
  <a class="skip" id="skip-link" href="#panel">Skip to the guide</a>
  <div class="bg-wash" aria-hidden="true"></div>

  <header class="top-nav" id="top-nav">
    <div class="nav-bar">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true">
          <img src="./favicon.svg" alt="Chile Whitewater Logo" width="48" height="48">
        </span>
        <span class="brand-copy">
          <span class="brand-line" id="brand-line-1">CHILE WHITEWATER</span>
          <span class="brand-line" id="brand-line-2">KAYAK GUIDE</span>
        </span>
      </a>
      <div class="nav-controls">
        <div class="nav-actions" id="nav-actions">
          <a class="nav-link" id="with-link" href="./with">
            <span class="with-long">Who to go with</span>
            <span class="with-short">Who</span>
            <svg class="with-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
          </a>
          <div class="nav-group-row">
            <div class="unit-toggle" role="group" aria-label="Flow unit">
              <button type="button" class="unit-btn is-on" id="unit-cms" aria-pressed="true">m³/s</button>
              <button type="button" class="unit-btn" id="unit-cfs" aria-pressed="false">cfs</button>
            </div>
            <button type="button" class="lang-btn" id="langBtn" aria-label="Language, English. Switch to Spanish.">EN</button>
            <button type="button" class="icon-btn theme-btn" id="themeBtn" aria-label="Switch to light mode">
              <svg class="theme-icon theme-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <svg class="theme-icon theme-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
            </button>
          </div>
          <div class="nav-group-row nav-group-secondary">
            <button type="button" class="about-btn" id="about-trigger" aria-haspopup="dialog" aria-controls="about-dialog">
              <span class="about-label">About</span>
            </button>
            <button type="button" class="install-btn" id="installBtn" hidden>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M12 8v7M8.5 11.5h7"/></svg>
              <span class="ib-long">Add to home screen</span>
              <span class="ib-short">Install</span>
            </button>
          </div>
        </div>
        <button type="button" class="search-btn" id="search-trigger" aria-haspopup="dialog" aria-controls="search-dialog" aria-label="Search rivers and regions">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
          <span class="search-label">Search</span>
          <span class="kbd">⌘K</span>
        </button>
        <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-actions" aria-label="Open menu">
          <svg class="icon-menu" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          <svg class="icon-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div class="nav-scrim" id="nav-scrim" hidden></div>

  <div class="atlas" id="atlas">
    <section class="map-stage" id="map-stage" aria-label="Map of Chile">
      <a class="map-back" id="map-back" href="./" hidden>All of Chile</a>
      <p class="north-arrow" aria-hidden="true"><span>N</span><i></i></p>
      <div class="map-canvas" id="chile-map"></div>
      <p class="map-caption" id="map-caption">Mainland boundaries · Natural Earth</p>
    </section>
    <div class="panel" id="panel">
      <main id="app-view"></main>
      <footer class="foot">
        <p class="foot-partners">
          <a id="foot-partner" href="https://puconkayakretreat.com" target="_blank" rel="noopener noreferrer">Pucón Kayak Retreat</a>
          <a id="foot-cwl" href="https://chilewaterlevels.com" target="_blank" rel="noopener noreferrer">Chile Water Levels</a>
        </p>
        <p id="foot-note">An independent field guide. Scout every rapid, read the water, and check the gauge before you put on.</p>
      </footer>
    </div>
  </div>

  <div class="modal-overlay" id="search-modal-overlay" aria-hidden="true">
    <div class="modal" id="search-dialog" role="dialog" aria-modal="true" aria-labelledby="search-title">
      <div class="modal-head">
        <h2 id="search-title" class="visually-hidden">Search runs</h2>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
        <input id="search-modal-input" type="search" placeholder="Rivers, towns, regions" autocomplete="off" aria-label="Search rivers">
        <button type="button" class="icon-btn" id="search-modal-close" aria-label="Close search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="search-results" id="search-modal-results"></div>
    </div>
  </div>

  <div class="modal-overlay" id="about-modal-overlay" aria-hidden="true">
    <div class="modal about-modal" id="about-dialog" role="dialog" aria-modal="true" aria-labelledby="about-title">
      <div class="modal-head">
        <h2 id="about-title">About this guide</h2>
        <button type="button" class="icon-btn" id="about-modal-close" aria-label="Close about">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="about-body" id="about-body"></div>
    </div>
  </div>

  <div class="sheet-bg" id="installSheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="installTitle">
      <div id="installBody"></div>
      <div class="sheet-actions">
        <button class="btn btn-primary" id="installClose" type="button">Got it</button>
        <button class="btn" id="installDismiss" type="button">Don’t show this again</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
