<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Chile Kayak Guide</title>
  <meta name="description" content="That page is not in the Chile kayak guide.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07141c">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07141c; color: #f6f1e8; font: 18px/1.5 Georgia, "Iowan Old Style", serif; }
    main { max-width: 28rem; padding: 2rem; }
    p { color: #c9d7df; }
    a { color: #e39a62; }
  </style>
</head>
<body>
  <main>
    <h1>That page isn’t on the map.</h1>
    <p>The address doesn’t match a region or a run in this guide.</p>
    <p><a id="home" href="/">Back to all of Chile</a></p>
  </main>
  <script>
    (function () {
      var path = location.pathname;
      var marker = '/chile-kayak-guide/';
      var at = path.indexOf(marker);
      if (at !== -1) document.getElementById('home').href = path.slice(0, at) + marker;
    })();
  </script>
</body>
</html>
