# Cloudflare Pages / Workers Configuration
# Deploy with: npx wrangler pages deploy dist --project-name=chile-kayak-guide

name = "chile-kayak-guide"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

[vars]
ENVIRONMENT = "production"
APP_NAME = "Chile Whitewater Kayaking Guide"
PARTNER = "Pucon Kayak Retreat (PKR)"
TELEMETRY_SOURCE = "ChileWaterLevels.com"

# Serverless Pages Functions (edge functions under /functions)
[build]
command = "npm run build"
output_directory = "dist"
